services:
  gastos:
    build: ${BUILD_CONTEXT:-.}
    image: gastos:latest
    container_name: gastos
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATA_DIR: /data
      AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com}
      AI_MODEL: ${AI_MODEL:-deepseek-v4-pro}
      AI_IMAGES: ${AI_IMAGES:-false}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
